<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

<defs>

<filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.55"
        numOctaves="4"
        seed="17"
        result="noise"/>

    <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="2"/>

    <feColorMatrix type="saturate" values="0.95"/>
</filter>

<mask id="distress">

    <rect width="100%" height="100%" fill="white"/>

    <!-- Top -->
    <rect x="110" y="54" width="120" height="18" fill="black"/>
    <rect x="465" y="54" width="95" height="18" fill="black"/>
    <rect x="885" y="54" width="140" height="18" fill="black"/>

    <!-- Bottom -->
    <rect x="160" y="348" width="140" height="18" fill="black"/>
    <rect x="515" y="348" width="120" height="18" fill="black"/>
    <rect x="885" y="348" width="170" height="18" fill="black"/>

    <!-- Left -->
    <rect x="70" y="110" width="18" height="70" fill="black"/>
    <rect x="70" y="245" width="18" height="60" fill="black"/>

    <!-- Right -->
    <rect x="1112" y="90" width="18" height="95" fill="black"/>
    <rect x="1112" y="245" width="18" height="70" fill="black"/>

    <!-- Ink chips -->
    <g fill="black">
        <circle cx="210" cy="108" r="5"/>
        <circle cx="295" cy="255" r="4"/>
        <circle cx="420" cy="160" r="6"/>
        <circle cx="590" cy="120" r="5"/>
        <circle cx="660" cy="220" r="4"/>
        <circle cx="775" cy="165" r="6"/>
        <circle cx="955" cy="205" r="5"/>
        <circle cx="1020" cy="145" r="5"/>
    </g>

</mask>

</defs>

<g transform="rotate(-2 600 210)"
   mask="url(#distress)"
   filter="url(#ink)"
   fill="#8B1717"
   stroke="#8B1717">

    <!-- OUTER BORDER -->
    <rect
        x="70"
        y="60"
        width="1060"
        height="300"
        rx="10"
        fill="none"
        stroke-width="15"/>

    <!-- INNER BORDER -->
    <rect
        x="98"
        y="88"
        width="1004"
        height="244"
        rx="5"
        fill="none"
        stroke-width="5"
        stroke-dasharray="30 14"
        opacity=".72"/>

    <!-- TEXT -->
    <text
        x="600"
        y="225"
        text-anchor="middle"
        font-family="Bebas Neue, Oswald, Impact, Arial Black, sans-serif"
        font-size="96"
        font-weight="900"
        letter-spacing="10"
        fill="#8B1717">
        INDUCTION'26
    </text>

    <!-- SCRATCHES -->
    <g
        stroke="#8B1717"
        stroke-width="1.8"
        stroke-linecap="round"
        opacity=".24">

        <line x1="170" y1="112" x2="179" y2="120"/>
        <line x1="188" y1="184" x2="197" y2="191"/>
        <line x1="221" y1="138" x2="230" y2="146"/>
        <line x1="252" y1="235" x2="260" y2="243"/>
        <line x1="285" y1="170" x2="293" y2="176"/>
        <line x1="330" y1="130" x2="337" y2="138"/>
        <line x1="365" y1="262" x2="373" y2="270"/>
        <line x1="402" y1="152" x2="410" y2="160"/>
        <line x1="435" y1="108" x2="443" y2="116"/>
        <line x1="470" y1="286" x2="478" y2="294"/>
        <line x1="510" y1="162" x2="519" y2="170"/>
        <line x1="545" y1="204" x2="552" y2="211"/>
        <line x1="586" y1="118" x2="594" y2="126"/>
        <line x1="620" y1="250" x2="628" y2="258"/>
        <line x1="664" y1="150" x2="672" y2="157"/>
        <line x1="703" y1="104" x2="710" y2="111"/>
        <line x1="742" y1="224" x2="750" y2="232"/>
        <line x1="785" y1="172" x2="793" y2="180"/>
        <line x1="824" y1="132" x2="831" y2="140"/>
        <line x1="865" y1="278" x2="873" y2="286"/>
        <line x1="900" y1="190" x2="909" y2="198"/>
        <line x1="944" y1="120" x2="952" y2="128"/>
        <line x1="980" y1="238" x2="988" y2="245"/>
        <line x1="1018" y1="156" x2="1026" y2="164"/>

        <line x1="205" y1="300" x2="214" y2="308"/>
        <line x1="382" y1="302" x2="390" y2="309"/>
        <line x1="563" y1="295" x2="571" y2="302"/>
        <line x1="751" y1="306" x2="759" y2="313"/>
        <line x1="935" y1="296" x2="943" y2="303"/>

        <line x1="252" y1="96" x2="260" y2="103"/>
        <line x1="451" y1="94" x2="459" y2="102"/>
        <line x1="647" y1="95" x2="655" y2="103"/>
        <line x1="851" y1="96" x2="859" y2="103"/>
    </g>

</g>

</svg>